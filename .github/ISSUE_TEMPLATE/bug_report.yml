name: Bug report
description: 安装、连接或工具执行异常
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先看 `docs/migration.md` 与 `docs/bridge-protocol.md`。
        日志请裁剪并删除模型路径、用户名等个人信息。
  - type: input
    id: revit
    attributes:
      label: Revit 版本
      placeholder: 2027.3
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Windows 版本
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 期望结果 vs 实际结果
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 错误信息 / 日志片段
      render: text
